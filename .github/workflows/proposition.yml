name: Proposition validée

# Se déclenche quand TU ajoutes une étiquette à une issue (seuls les collaborateurs du dépôt le peuvent).
#   valider → l'événement est revalidé puis ajouté à data/events.json, le site est reconstruit
#   refuser → l'issue est fermée
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: proposition
  cancel-in-progress: false

jobs:
  traiter:
    if: github.event.label.name == 'valider' || github.event.label.name == 'refuser'
    runs-on: ubuntu-latest
    steps:
      - name: Refuser
        if: github.event.label.name == 'refuser'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "Proposition écartée."
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason "not planned"

      - uses: actions/checkout@v4
        if: github.event.label.name == 'valider'
      - uses: actions/setup-python@v5
        if: github.event.label.name == 'valider'
        with:
          python-version: "3.11"

      # Le texte de l'issue n'est JAMAIS placé dans une commande shell : le script Python le lit
      # lui-même dans le fichier d'événement GitHub, puis revalide chaque champ.
      - name: Valider et ajouter
        if: github.event.label.name == 'valider'
        id: add
        env:
          NUM: ${{ github.event.issue.number }}
        run: |
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scrapers/propositions.py
            if git diff --quiet data/events.json; then echo "pushed=true" >> "$GITHUB_OUTPUT"; break; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/events.json
            git commit -q -m "Proposition acceptée (issue #$NUM)"
            if git push -q origin HEAD:main; then echo "pushed=true" >> "$GITHUB_OUTPUT"; break; fi
            echo "push refusé (collecte en cours ?), nouvel essai"; sleep 5
          done

      - name: Répondre, clôturer, reconstruire le site
        if: github.event.label.name == 'valider'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          RESULT: ${{ steps.add.outputs.result }}
          MESSAGE: ${{ steps.add.outputs.message }}
          PUSHED: ${{ steps.add.outputs.pushed }}
        run: |
          say() { gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$1"; }
          if [ "$RESULT" = "added" ] && [ "$PUSHED" = "true" ]; then
            say "Proposition publiée. Le site est en cours de reconstruction (quelques minutes)."
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed
            gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main
          elif [ "$RESULT" = "duplicate" ]; then
            say "Cet événement existe déjà sur le site."
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          elif [ "$RESULT" = "invalid" ]; then
            say "Proposition non publiée : $MESSAGE"
          else
            say "Échec de la publication. Retire puis remets l'étiquette valider pour réessayer."
            exit 1
          fi
